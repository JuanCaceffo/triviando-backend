server:
  port: ${API_PORT:8080}

spring:
  # H2 no soporta el dialecto de las migraciones MySQL; el esquema de test
  # se sigue generando desde las entidades. La validación de Flyway se hace
  # en el perfil de integración contra MySQL real.
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: admin
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

jwt:
  secret: clavesecretaparatesteosgodines123432e
  expiration: 43200000

google:
  client-id: test-client-id

mercadopago:
  accessToken: TEST-token-de-pruebas
  feDomain: https://triviando.test
  notificationUrl: https://triviando.test/api/v1/suscriptions/payment
  webhookSecret: test-secret
  planPrice: 10000
