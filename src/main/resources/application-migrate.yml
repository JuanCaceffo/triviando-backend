server:
  # El migrador no debe competir por el puerto de la app
  port: 0

app:
  migration:
    # Seguro por defecto: hay que pasar --app.migration.dry-run=false para escribir
    dry-run: true
    # Modo CLI: cerrar la aplicación al terminar
    exit-after-run: true
    batch-size: 100
    jobs-window-hours: 24
    fail-on-orphans: true
