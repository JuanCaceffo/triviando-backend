spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM:no-reply@triviando.com.ar}
    from-name: TrivIAndo

server:
  servlet:
    context-path: /api/v1

api:
  questions:
    questions-per-topic: 5
    max-topics-free-per-day: 5
    max-questions-free-per-day: 100

mercadopago:
  accessToken: ${MP_ACCESS_TOKEN}
  feDomain: ${FE_DOMAIN}
