spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  mail:
    from: ${MAIL_FROM:no-reply@triviando.com.ar}
    from-name: TrivIAndo

server:
  servlet:
    context-path: /api/v1
  tomcat:
    # Permite devolver un 413 limpio cuando el archivo supera el limite
    max-swallow-size: 12MB

api:
  questions:
    questions-per-topic: 5
  documents:
    max-file-size-bytes: 10485760
    max-extracted-chars: 400000
    prompt-budget-chars: 30000
    chunk-size-chars: 8000
    max-chunks: 10
    max-pdf-pages: 200
    stale-job-minutes: 15
    one-active-job-per-user: true

mercadopago:
  accessToken: ${MP_ACCESS_TOKEN}
  feDomain: ${FE_DOMAIN}
