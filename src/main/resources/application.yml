spring:
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Prod ya tiene tablas creadas por ddl-auto: se marca V1 como baseline
    # y solo se aplican las migraciones posteriores.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  task:
    scheduling:
      pool:
        size: 4

app:
  mail:
    from: ${MAIL_FROM:no-reply@triviando.com.ar}
    from-name: TrivIAndo
  cors:
    # Incluye el dominio del frontend; sin esto el navegador bloquea REST y SSE.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://triviando-phi.vercel.app,https://triviando.com.ar}

server:
  servlet:
    context-path: /api/v1
  tomcat:
    # Permite devolver un 413 limpio cuando el archivo supera el limite
    max-swallow-size: 12MB

api:
  questions:
    questions-per-topic: 5
  rooms:
    max-players: 40
    question-count: 10
    round-seconds: 30
    reveal-seconds: 8
    min-players: 2
    host-grace-seconds: 60
    preparing-expiry-minutes: 30
    lobby-expiry-minutes: 30
    in-progress-expiry-minutes: 60
    finished-expiry-minutes: 15
    closed-expiry-minutes: 5
    sse-timeout-ms: 7200000
    heartbeat-ms: 15000
    reaction-cooldown-ms: 2000
    scheduler-enabled: true
  documents:
    max-file-size-bytes: 10485760
    max-extracted-chars: 400000
    prompt-budget-chars: 30000
    chunk-size-chars: 8000
    max-chunks: 10
    max-pdf-pages: 200
    stale-job-minutes: 15
    one-active-job-per-user: true

mercadopago:
  accessToken: ${MP_ACCESS_TOKEN}
  feDomain: ${FE_DOMAIN}
  notificationUrl: ${MP_NOTIFICATION_URL:}
  webhookSecret: ${MP_WEBHOOK_SECRET:}
  planPrice: ${MP_PLAN_PRICE:10000}
