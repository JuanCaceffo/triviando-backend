name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-triviando-backend
  cancel-in-progress: false

env:
  IMAGE: juancaceffo/triviando-backend
  # App "triviando-backend" en Dokploy
  DOKPLOY_APP_ID: GrSm5DCiF44xGB6MC0xNZ
  DOKPLOY_URL: ${{ vars.DOKPLOY_URL || 'https://dokploy-hook.triviando.com.ar' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: juancaceffo
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image and deploy in Dokploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE}:${GITHUB_SHA}"
          echo "Deploying ${IMAGE_TAG}"

          curl -fsS -X POST "${DOKPLOY_URL}/api/application.saveDockerProvider" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\",\"dockerImage\":\"${IMAGE_TAG}\",\"username\":null,\"password\":null,\"registryUrl\":null}"
          echo

          curl -fsS -X POST "${DOKPLOY_URL}/api/application.deploy" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"${DOKPLOY_APP_ID}\"}"
          echo
